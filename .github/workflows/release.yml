name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.3.0
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Type check
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Pack the tarball
        run: |
          bun pm pack --destination .release
          ls -la .release
      - name: Publish to npm
        # Bun packs and publishes, so the release path matches the local one.
        # Set up trusted publishing for this workflow on npmjs.com and put the
        # automation token in the NPM_TOKEN secret.
        run: bun publish "$PWD"/.release/*.tgz --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Attach the tarball to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .release/*.tgz
